name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check private configuration is excluded
        run: |
          test -f .env.example
          test ! -e .env
          test ! -e ai.config.local.js
      - name: Run game and network tests
        run: npm test
      - name: Run browser tests
        run: npm run test:ui
